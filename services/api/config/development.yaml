# Development profile for lawsynth-api.
#
# Fields map to ApiSettings (services/api/src/lawsynth_api/settings.py) and the
# nested ServerSettings (python/lawsynth-server/src/lawsynth_server/settings.py).
# The process reads only environment variables at startup (ApiSettings.from_
# environment); it does not parse this YAML. This document records the intended
# local shape and shows the environment variable each field is read from. The
# values below reproduce the built-in defaults, so a developer sees the same
# behavior the process applies out of the box.

profile: development

# environment -> LAWSYNTH_API_ENV; one of development|test|staging|production.
environment: development

server:
  # database_url -> LAWSYNTH_DATABASE_URL. ":memory:" is an ephemeral SQLite
  # database; durable storage is required only in the production profile.
  database_url: ":memory:"
  # object_root -> LAWSYNTH_OBJECT_ROOT; created on first write. Relative in dev,
  # must be absolute in production.
  object_root: ./.lawsynth-objects
  # max_page_size -> LAWSYNTH_MAX_PAGE_SIZE; server cap on a page (1..1000).
  max_page_size: 100
  # max_upload_bytes -> LAWSYNTH_MAX_UPLOAD_BYTES; largest artifact body.
  max_upload_bytes: 67108864          # 64 MiB
  # telemetry_enabled -> LAWSYNTH_TELEMETRY ("true"/"false"); privacy-preserving
  # in-process counters only, never payload content.
  telemetry_enabled: false

# max_request_bytes -> LAWSYNTH_API_MAX_REQUEST_BYTES; whole-request ceiling
# enforced at the WSGI boundary. Must be >= server.max_upload_bytes.
max_request_bytes: 67108864           # 64 MiB

# event_stream_retention -> LAWSYNTH_API_EVENT_RETENTION; per-scope SSE ring
# buffer depth (positive integer).
event_stream_retention: 1024

# The transport publishes a single API protocol version on every response and
# serves it under the /v1 route prefix. It is not configurable.
api_protocol_version: "1"

# Bearer grants -> LAWSYNTH_API_TOKENS_JSON (a JSON object). Never store real
# tokens here; supply them from a secret manager at deploy time. See
# .env.example for the shape: token -> {organization_id, scopes[read|write|admin]}.
tokens: {}
