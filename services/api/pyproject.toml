[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lawsynth-api"
version = "0.1.0"
description = "Production WSGI facade for the LawSynth server domain core"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = ["lawsynth-server>=0.1.0"]

[project.optional-dependencies]
server = ["gunicorn>=22,<24"]
test = ["pytest>=8"]

[project.scripts]
lawsynth-api = "lawsynth_api.main:main"

[tool.setuptools.packages.find]
where = ["src"]
