[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lawsynth-gateway"
version = "0.1.0"
description = "In-process WSGI admission gateway for LawSynth"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}

[project.scripts]
lawsynth-gateway = "lawsynth_gateway.main:main"

[tool.setuptools.packages.find]
where = ["src"]
