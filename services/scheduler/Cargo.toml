[package]
name = "lawsynth-scheduler"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Durable local scheduler for typed LawSynth worker jobs."

[dependencies]
lawsynth-runner = { path = "../../crates/lawsynth-runner" }
lawsynth-store = { path = "../../crates/lawsynth-store" }
lawsynth-worker = { path = "../worker" }

[dev-dependencies]
lawsynth-core = { path = "../../crates/lawsynth-core" }
lawsynth-data = { path = "../../crates/lawsynth-data" }
lawsynth-expr = { path = "../../crates/lawsynth-expr" }
lawsynth-sim = { path = "../../crates/lawsynth-sim" }
lawsynth-world = { path = "../../crates/lawsynth-world" }

[lib]
path = "src/lib.rs"

[[bin]]
name = "lawsynth-scheduler"
path = "src/main.rs"
