# LawSynth — local single-node development stack.
#
# Brings up two planes on one machine:
#
#   Product loop (runnable today):
#     client ─▶ gateway :8081 ─▶ api :8080 ─┬─▶ SQLite  (metadata,   api volume)
#                                           └─▶ files   (object store, api volume)
#     The API runs discovery on the compiled `lawsynth` engine IN-PROCESS; it
#     does NOT use Postgres/MinIO/NATS. For a minimal, self-contained version of
#     just this loop see ../../quickstart.
#
#   Rust execution plane (infrastructure present; NOT yet wired to the API):
#     scheduler ─▶ postgres :5432, nats :4222
#     worker    ─▶ postgres, nats, artifact :8082
#     postgres / minio :9000 / nats :4222 back THIS plane, not the API.
#
# This is the "Single-node server" deployment mode from the architecture. It is
# for local development and evaluation only — it ships local-only default
# credentials and no TLS. For a hardened deployment use ../production.
#
# Usage:
#   cp .env.example .env         # then edit as needed
#   docker compose up --build -d
#   ./healthcheck.sh
#   docker compose logs -f api worker
#   docker compose down          # add --volumes to also delete data
#
# Each service is defined in its own file and merged here via `include:` so the
# individual definitions stay small and independently reviewable.

name: lawsynth-local

include:
  - volumes.yaml
  - postgres.yaml
  - minio.yaml
  - nats.yaml
  - api.yaml
  - worker.yaml
