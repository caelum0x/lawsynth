# Post-deploy smoke test. Runs once after a staging rollout to confirm the
# public path (gateway -> api) is healthy and the version endpoint responds.
# CI applies this Job and waits for completion before marking a deploy green.
apiVersion: batch/v1
kind: Job
metadata:
  name: lawsynth-smoke
  labels:
    app.kubernetes.io/part-of: lawsynth
    app.kubernetes.io/component: smoke-test
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: lawsynth
        app.kubernetes.io/component: smoke-test
    spec:
      restartPolicy: Never
      serviceAccountName: lawsynth-gateway
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: smoke
          image: curlimages/curl:8.11.1
          command: ["/bin/sh", "-euc"]
          args:
            - |
              base="http://gateway.lawsynth-staging.svc.cluster.local:8081/v1"
              echo "checking ${base}/health"
              curl --fail --show-error --silent --max-time 10 "${base}/health"
              echo
              echo "checking ${base}/version"
              curl --fail --show-error --silent --max-time 10 "${base}/version"
              echo
              echo "smoke test passed"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
