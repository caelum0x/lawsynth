# TEMPLATE ONLY -- DO NOT COMMIT REAL VALUES AND DO NOT `kubectl apply` THIS.
#
# This file documents the shape of the `lawsynth-secrets` Secret that every
# LawSynth service consumes via `envFrom.secretRef`. In a real cluster the
# Secret is produced by a secret manager (External Secrets Operator, Sealed
# Secrets, or Vault Agent) so plaintext credentials never live in git.
#
# Job envelopes must stay secret-free (architecture section 22); these values
# are injected into service Pods only, not into job payloads.
#
# To create it manually for a throwaway staging namespace:
#
#   kubectl -n lawsynth-staging create secret generic lawsynth-secrets \
#     --from-literal=LAWSYNTH_DATABASE_URL='postgresql://lawsynth:CHANGE_ME@postgres:5432/lawsynth' \
#     --from-literal=LAWSYNTH_API_TOKENS_JSON='{"CHANGE_ME_AT_LEAST_16_CHARS":{"organization_id":"staging","scopes":["read","write"]}}' \
#     --from-literal=LAWSYNTH_OBJECT_STORE_ACCESS_KEY='CHANGE_ME' \
#     --from-literal=LAWSYNTH_OBJECT_STORE_SECRET_KEY='CHANGE_ME' \
#     --from-literal=LAWSYNTH_EVENT_BUS_TOKEN='CHANGE_ME'
apiVersion: v1
kind: Secret
metadata:
  name: lawsynth-secrets
  labels:
    app.kubernetes.io/part-of: lawsynth
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # Postgres DSN with password. Must use durable storage (the API rejects an
  # in-memory database when LAWSYNTH_API_ENV is staging/production).
  LAWSYNTH_DATABASE_URL: "postgresql://lawsynth:REPLACE_WITH_SECRET_MANAGER_REF@postgres.lawsynth-staging.svc.cluster.local:5432/lawsynth"
  # Map of >=16-char bearer tokens to tenant grants (organization_id + scopes).
  LAWSYNTH_API_TOKENS_JSON: '{"REPLACE_WITH_16PLUS_CHAR_TOKEN":{"organization_id":"staging","scopes":["read","write"]}}'
  # Object store (S3/MinIO) credentials for the artifact service.
  LAWSYNTH_OBJECT_STORE_ACCESS_KEY: "REPLACE_WITH_SECRET_MANAGER_REF"
  LAWSYNTH_OBJECT_STORE_SECRET_KEY: "REPLACE_WITH_SECRET_MANAGER_REF"
  # NATS credentials token for the event bus (optional if NATS is open in-mesh).
  LAWSYNTH_EVENT_BUS_TOKEN: "REPLACE_WITH_SECRET_MANAGER_REF"
