# Deny-by-default network posture for the staging namespace, then explicit
# allows that mirror the call graph: internet -> gateway -> api -> {scheduler,
# artifact, postgres, nats}; worker -> {scheduler, artifact, postgres, nats}.
# This enforces the trust boundary that only the gateway is reachable from
# outside the mesh (architecture section 22).
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  labels:
    app.kubernetes.io/part-of: lawsynth
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
# Allow all Pods to resolve DNS (kube-dns) -- required for service discovery.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  labels:
    app.kubernetes.io/part-of: lawsynth
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# The gateway accepts ingress from the ingress controller and may call the API.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway
  labels:
    app.kubernetes.io/part-of: lawsynth
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gateway
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8081
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: api
      ports:
        - protocol: TCP
          port: 8080
---
# The API accepts ingress only from the gateway; it may reach the scheduler,
# artifact service, and backing stores (matched by label on external services).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api
  labels:
    app.kubernetes.io/part-of: lawsynth
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: api
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gateway
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: scheduler
      ports:
        - protocol: TCP
          port: 8083
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: artifact
      ports:
        - protocol: TCP
          port: 8082
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: lawsynth-data
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 4222
---
# Workers never receive ingress traffic; they lease jobs and push artifacts.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: worker
  labels:
    app.kubernetes.io/part-of: lawsynth
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: worker
  policyTypes: ["Ingress", "Egress"]
  ingress:
    # Prometheus scrape of the worker metrics port only.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9094
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: scheduler
      ports:
        - protocol: TCP
          port: 8083
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: artifact
      ports:
        - protocol: TCP
          port: 8082
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: lawsynth-data
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 4222
