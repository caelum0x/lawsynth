# TEMPLATE ONLY -- DO NOT COMMIT REAL VALUES AND DO NOT `kubectl apply` THIS.
#
# Documents the shape of the `lawsynth-secrets` Secret consumed by the
# production services and the metadata backup CronJob. In production the Secret
# MUST be produced by a secret manager (External Secrets Operator, Sealed
# Secrets, or Vault Agent). Plaintext credentials must never enter git or a job
# envelope (architecture section 22).
apiVersion: v1
kind: Secret
metadata:
  name: lawsynth-secrets
  labels:
    app.kubernetes.io/part-of: lawsynth
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # Postgres DSN with password. Durable storage is mandatory in production.
  LAWSYNTH_DATABASE_URL: "postgresql://lawsynth:REPLACE_WITH_SECRET_MANAGER_REF@postgres.lawsynth.svc.cluster.local:5432/lawsynth"
  # Map of >=16-char bearer tokens to tenant grants (organization_id + scopes).
  LAWSYNTH_API_TOKENS_JSON: '{"REPLACE_WITH_16PLUS_CHAR_TOKEN":{"organization_id":"prod-tenant","scopes":["read","write"]}}'
  # Object store (S3/MinIO) credentials for the artifact service.
  LAWSYNTH_OBJECT_STORE_ACCESS_KEY: "REPLACE_WITH_SECRET_MANAGER_REF"
  LAWSYNTH_OBJECT_STORE_SECRET_KEY: "REPLACE_WITH_SECRET_MANAGER_REF"
  # NATS event-bus credentials token.
  LAWSYNTH_EVENT_BUS_TOKEN: "REPLACE_WITH_SECRET_MANAGER_REF"
  # MinIO client alias used by the backup CronJob, in the form:
  #   https://ACCESS_KEY:SECRET_KEY@objectstore.lawsynth.example
  LAWSYNTH_BACKUP_MC_HOST: "https://REPLACE_ACCESS:REPLACE_SECRET@objectstore.lawsynth.example"
