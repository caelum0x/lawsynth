# Production ingress. TLS terminates at the ingress controller and traffic is
# routed exclusively to the gateway, which performs request admission before the
# API ever sees a request (architecture sections 7, 22). The API is never
# exposed directly to the internet.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lawsynth
  labels:
    app.kubernetes.io/part-of: lawsynth
    app.kubernetes.io/component: edge
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "64m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    # Do not buffer Server-Sent Events used for streaming run progress.
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    # Modern TLS only; HSTS is set by the controller default config.
    nginx.ingress.kubernetes.io/ssl-protocols: "TLSv1.2 TLSv1.3"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.lawsynth.example
      secretName: lawsynth-tls
  rules:
    - host: api.lawsynth.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8081
