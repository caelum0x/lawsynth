{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "lawsynth.fullname" . }}
  labels:
    {{- include "lawsynth.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: {{ .Values.ingress.path }}
            pathType: {{ .Values.ingress.pathType }}
            backend:
              service:
                name: {{ include "lawsynth.fullname" . }}-api
                port:
                  number: {{ .Values.api.service.port }}
{{- end }}
{{- if .Values.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "lawsynth.fullname" . }}-api
  labels:
    {{- include "lawsynth.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "lawsynth.componentSelectorLabels" (dict "root" . "component" "api") | nindent 6 }}
{{- end }}
{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "lawsynth.fullname" . }}-default
  labels:
    {{- include "lawsynth.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "lawsynth.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # Allow intra-release traffic between LawSynth components.
    - from:
        - podSelector:
            matchLabels:
              {{- include "lawsynth.selectorLabels" . | nindent 14 }}
    # Allow ingress controllers and the same namespace to reach the API.
    - from:
        - namespaceSelector: {}
      ports:
        - port: {{ .Values.api.service.port }}
          protocol: TCP
{{- end }}
