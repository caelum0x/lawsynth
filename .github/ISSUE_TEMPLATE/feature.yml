name: Capability proposal
description: Propose a bounded, testable addition to the implemented engine.
title: "[proposal] "
labels: ["proposal"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the scientific or engineering need and why existing behavior is insufficient.
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: Proposed contract
      description: Include inputs, outputs, failure modes, and compatibility implications.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation plan
      description: Specify reproducible tests, fixtures, or numerical evidence.
    validations:
      required: true
