name: Regenerate pnpm lockfile

# One-click fix for a stale pnpm-lock.yaml (the committed one predates
# @types/node in @lawsynth/state-store, so --frozen-lockfile can't proceed on
# Cloudflare / CI). Run this from the Actions tab (Run workflow) — it regenerates
# the lockfile on GitHub's network using the repo's pinned pnpm config
# (autoInstallPeers=false) and commits it back to the branch. After it runs,
# Cloudflare's frozen install passes.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pnpm install --no-frozen-lockfile
      - name: Commit the regenerated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "pnpm-lock.yaml already up to date"
          else
            git commit -m "chore: regenerate pnpm-lock.yaml"
            git push
          fi
