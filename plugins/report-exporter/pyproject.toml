[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lawsynth-report-exporter"
version = "0.1.0"
description = "LawSynth report exporter plugin: deterministic Markdown, HTML, and JSON rendering."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "LawSynth" }]
keywords = ["lawsynth", "plugin", "report", "export"]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
