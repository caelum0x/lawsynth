[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lawsynth-plugin-custom-stage-python"
version = "0.1.0"
description = "Declarative discovery-pipeline stage: bounded select, rename, filter, and fill operations with no code evaluation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "LawSynth contributors" }]
keywords = ["lawsynth", "plugin", "pipeline", "stage"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

# The host discovers plugins through this entry-point group. The value points at
# the callable class declared as `entrypoint` in plugin.toml.
[project.entry-points."lawsynth.plugins"]
custom-stage-python = "custom_stage_python.plugin:CustomStage"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
