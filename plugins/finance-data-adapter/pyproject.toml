[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lawsynth-plugin-finance-data-adapter"
version = "0.1.0"
description = "Adapter that normalizes provider-specific market bars into a reproducible OHLCV schema for LawSynth"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "LawSynth contributors" }]
keywords = ["lawsynth", "plugin", "finance", "ohlcv", "data-adapter"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

# The host discovers plugins through this entry-point group. The value points at
# the callable class declared as `entrypoint` in plugin.toml.
[project.entry-points."lawsynth.plugins"]
finance-data-adapter = "finance_data_adapter.plugin:FinanceDataAdapter"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
