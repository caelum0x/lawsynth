[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lawsynth-fixture-builder"
version = "0.1.0"
description = "Build deterministic, canonically-encoded JSON test fixtures for LawSynth"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "LawSynth contributors" }]
dependencies = []

[project.scripts]
lawsynth-fixture-builder = "main:main"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["main", "generate", "canonicalize", "checksum", "package"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
