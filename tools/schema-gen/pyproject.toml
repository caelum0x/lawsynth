[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lawsynth-schema-gen"
version = "0.1.0"
description = "Generate JSON Schema, TypeScript, and Python types from LawSynth spec contracts"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "LawSynth contributors" }]
dependencies = []

[project.scripts]
lawsynth-schema-gen = "main:main"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["main", "schema", "jsonschema", "typescript", "python"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
