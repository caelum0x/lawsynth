[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lawsynth-benchmark-site"
version = "0.1.0"
description = "Render LawSynth scientific benchmark results into a static HTML/JSON site."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "LawSynth contributors" }]
dependencies = []

[project.scripts]
benchmark-site = "main:main"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["main", "results", "compare", "charts", "publish"]

[tool.pytest.ini_options]
testpaths = ["tests"]
