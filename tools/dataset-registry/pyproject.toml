[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lawsynth-dataset-registry"
version = "0.1.0"
description = "Index and verify the LawSynth scientific benchmark datasets with checksums"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "LawSynth contributors" }]
dependencies = []

[project.scripts]
lawsynth-dataset-registry = "main:main"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["main", "manifest", "download", "verify", "card"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
