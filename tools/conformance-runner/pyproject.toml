[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lawsynth-conformance-runner"
version = "0.1.0"
description = "Discover, run, and score LawSynth cross-language conformance cases."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "LawSynth contributors" }]
dependencies = []

[project.scripts]
conformance-runner = "main:main"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["main", "discover", "execute", "compare", "report"]

[tool.pytest.ini_options]
testpaths = ["tests"]
