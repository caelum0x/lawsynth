[package]
name = "lawsynth-discovery"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Executable-world discovery orchestration for LawSynth."
autoexamples = false

[[example]]
name = "checkpoint_basic"
path = "examples/checkpoint_basic.rs"

[[bench]]
name = "branch_latency"
path = "benches/branch_latency.rs"
harness = false

[[bench]]
name = "candidate_throughput"
path = "benches/candidate_throughput.rs"
harness = false

[[bench]]
name = "distributed_throughput"
path = "benches/distributed_throughput.rs"
harness = false

[dependencies]
lawsynth-causal = { path = "../lawsynth-causal" }
lawsynth-core = { path = "../lawsynth-core" }
lawsynth-data = { path = "../lawsynth-data" }
lawsynth-differentiate = { path = "../lawsynth-differentiate" }
lawsynth-opt = { path = "../lawsynth-opt" }
lawsynth-expr = { path = "../lawsynth-expr" }
lawsynth-features = { path = "../lawsynth-features" }
lawsynth-profile = { path = "../lawsynth-profile" }
lawsynth-preprocess = { path = "../lawsynth-preprocess" }
lawsynth-regime = { path = "../lawsynth-regime" }
lawsynth-score = { path = "../lawsynth-score" }
lawsynth-sparse = { path = "../lawsynth-sparse" }
lawsynth-stats = { path = "../lawsynth-stats" }
lawsynth-symbolic = { path = "../lawsynth-symbolic" }
lawsynth-units = { path = "../lawsynth-units" }
lawsynth-world = { path = "../lawsynth-world" }
