[package]
name = "lawsynth-egraph"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Deterministic scalar equivalence graph and extraction for LawSynth."
autoexamples = false

[[example]]
name = "proof_basic"
path = "examples/proof_basic.rs"

[[bench]]
name = "cost_latency"
path = "benches/cost_latency.rs"
harness = false

[[bench]]
name = "extract_throughput"
path = "benches/extract_throughput.rs"
harness = false

[dependencies]
lawsynth-core = { path = "../lawsynth-core", version = "0.1.0" }
lawsynth-expr = { path = "../lawsynth-expr", version = "0.1.0" }
