[package]
name = "lawsynth-units"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Dimensional analysis primitives for LawSynth."
autoexamples = false

[[example]]
name = "check_basic"
path = "examples/check_basic.rs"

[[bench]]
name = "convert_throughput"
path = "benches/convert_throughput.rs"
harness = false

[[bench]]
name = "infer_latency"
path = "benches/infer_latency.rs"
harness = false

[lib]
path = "src/lib.rs"

[dependencies]
lawsynth-core = { path = "../lawsynth-core" }
lawsynth-expr = { path = "../lawsynth-expr" }
