[package]
name = "lawsynth-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Command-line interface for LawSynth executable worlds."
autoexamples = false

[[example]]
name = "intervene_basic"
path = "examples/intervene_basic.rs"

[[bench]]
name = "profile_throughput"
path = "benches/profile_throughput.rs"
harness = false

[[bench]]
name = "simulate_latency"
path = "benches/simulate_latency.rs"
harness = false

[[bin]]
name = "lawsynth"
path = "src/main.rs"

[dependencies]
lawsynth-bifurcation = { path = "../lawsynth-bifurcation" }
lawsynth-bundle = { path = "../lawsynth-bundle" }
lawsynth-control = { path = "../lawsynth-control" }
lawsynth-core = { path = "../lawsynth-core" }
lawsynth-data = { path = "../lawsynth-data" }
lawsynth-discovery = { path = "../lawsynth-discovery" }
lawsynth-domains = { path = "../lawsynth-domains" }
lawsynth-differentiate = { path = "../lawsynth-differentiate" }
lawsynth-egraph = { path = "../lawsynth-egraph" }
lawsynth-estimate = { path = "../lawsynth-estimate" }
lawsynth-expr = { path = "../lawsynth-expr" }
lawsynth-invariants = { path = "../lawsynth-invariants" }
lawsynth-jacobian = { path = "../lawsynth-jacobian" }
lawsynth-koopman = { path = "../lawsynth-koopman" }
lawsynth-modelreduce = { path = "../lawsynth-modelreduce" }
lawsynth-modelselect = { path = "../lawsynth-modelselect" }
lawsynth-plugin-api = { path = "../lawsynth-plugin-api" }
lawsynth-plugin-host = { path = "../lawsynth-plugin-host" }
lawsynth-preprocess = { path = "../lawsynth-preprocess" }
lawsynth-profile = { path = "../lawsynth-profile" }
lawsynth-report = { path = "../lawsynth-report" }
lawsynth-sensitivity = { path = "../lawsynth-sensitivity" }
lawsynth-sim = { path = "../lawsynth-sim" }
lawsynth-stability = { path = "../lawsynth-stability" }
lawsynth-uncertainty = { path = "../lawsynth-uncertainty" }
lawsynth-stats = { path = "../lawsynth-stats" }
lawsynth-symbolic = { path = "../lawsynth-symbolic" }
lawsynth-units = { path = "../lawsynth-units" }
lawsynth-world = { path = "../lawsynth-world" }

[lib]
path = "src/lib.rs"

[dev-dependencies]
lawsynth-expr = { path = "../lawsynth-expr" }
lawsynth-world = { path = "../lawsynth-world" }
