[package]
name = "lawsynth-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Command-line interface for LawSynth executable worlds."
autoexamples = false

[[example]]
name = "intervene_basic"
path = "examples/intervene_basic.rs"

[[bench]]
name = "profile_throughput"
path = "benches/profile_throughput.rs"
harness = false

[[bench]]
name = "simulate_latency"
path = "benches/simulate_latency.rs"
harness = false

[[bin]]
name = "lawsynth"
path = "src/main.rs"

[dependencies]
lawsynth-basins = { path = "../lawsynth-basins", version = "0.1.0" }
lawsynth-bifurcation = { path = "../lawsynth-bifurcation", version = "0.1.0" }
lawsynth-bundle = { path = "../lawsynth-bundle", version = "0.1.0" }
lawsynth-control = { path = "../lawsynth-control", version = "0.1.0" }
lawsynth-core = { path = "../lawsynth-core", version = "0.1.0" }
lawsynth-data = { path = "../lawsynth-data", version = "0.1.0" }
lawsynth-discovery = { path = "../lawsynth-discovery", version = "0.1.0" }
lawsynth-domains = { path = "../lawsynth-domains", version = "0.1.0" }
lawsynth-differentiate = { path = "../lawsynth-differentiate", version = "0.1.0" }
lawsynth-egraph = { path = "../lawsynth-egraph", version = "0.1.0" }
lawsynth-estimate = { path = "../lawsynth-estimate", version = "0.1.0" }
lawsynth-expr = { path = "../lawsynth-expr", version = "0.1.0" }
lawsynth-invariants = { path = "../lawsynth-invariants", version = "0.1.0" }
lawsynth-jacobian = { path = "../lawsynth-jacobian", version = "0.1.0" }
lawsynth-koopman = { path = "../lawsynth-koopman", version = "0.1.0" }
lawsynth-lyapunov = { path = "../lawsynth-lyapunov", version = "0.1.0" }
lawsynth-modelreduce = { path = "../lawsynth-modelreduce", version = "0.1.0" }
lawsynth-modelselect = { path = "../lawsynth-modelselect", version = "0.1.0" }
lawsynth-mpc = { path = "../lawsynth-mpc", version = "0.1.0" }
lawsynth-network = { path = "../lawsynth-network", version = "0.1.0" }
lawsynth-pde = { path = "../lawsynth-pde", version = "0.1.0" }
lawsynth-plugin-api = { path = "../lawsynth-plugin-api", version = "0.1.0" }
lawsynth-plugin-host = { path = "../lawsynth-plugin-host", version = "0.1.0" }
lawsynth-preprocess = { path = "../lawsynth-preprocess", version = "0.1.0" }
lawsynth-profile = { path = "../lawsynth-profile", version = "0.1.0" }
lawsynth-report = { path = "../lawsynth-report", version = "0.1.0" }
lawsynth-sde = { path = "../lawsynth-sde", version = "0.1.0" }
lawsynth-sensitivity = { path = "../lawsynth-sensitivity", version = "0.1.0" }
lawsynth-sim = { path = "../lawsynth-sim", version = "0.1.0" }
lawsynth-stability = { path = "../lawsynth-stability", version = "0.1.0" }
lawsynth-weakform = { path = "../lawsynth-weakform", version = "0.1.0" }
lawsynth-uncertainty = { path = "../lawsynth-uncertainty", version = "0.1.0" }
lawsynth-stats = { path = "../lawsynth-stats", version = "0.1.0" }
lawsynth-symbolic = { path = "../lawsynth-symbolic", version = "0.1.0" }
lawsynth-units = { path = "../lawsynth-units", version = "0.1.0" }
lawsynth-world = { path = "../lawsynth-world", version = "0.1.0" }

[lib]
path = "src/lib.rs"

[dev-dependencies]
lawsynth-expr = { path = "../lawsynth-expr", version = "0.1.0" }
lawsynth-world = { path = "../lawsynth-world", version = "0.1.0" }
