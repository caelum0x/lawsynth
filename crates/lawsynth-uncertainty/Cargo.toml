[package]
name = "lawsynth-uncertainty"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Deterministic uncertainty quantification primitives for LawSynth"

[lib]
name = "lawsynth_uncertainty"
