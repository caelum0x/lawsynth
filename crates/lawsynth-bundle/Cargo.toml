[package]
name = "lawsynth-bundle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Deterministic .lsworld bundle I/O for LawSynth."
autoexamples = false

[[example]]
name = "signature_basic"
path = "examples/signature_basic.rs"

[[bench]]
name = "canonical_throughput"
path = "benches/canonical_throughput.rs"
harness = false

[[bench]]
name = "checksum_latency"
path = "benches/checksum_latency.rs"
harness = false

[dependencies]
lawsynth-core = { path = "../lawsynth-core", version = "0.1.0" }
lawsynth-expr = { path = "../lawsynth-expr", version = "0.1.0" }
lawsynth-world = { path = "../lawsynth-world", version = "0.1.0" }
lawsynth-units = { path = "../lawsynth-units", version = "0.1.0" }

[lib]
path = "src/lib.rs"

[dev-dependencies]
lawsynth-sim = { path = "../lawsynth-sim", version = "0.1.0" }
