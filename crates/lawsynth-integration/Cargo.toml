[package]
name = "lawsynth-integration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Cross-crate end-to-end integration tests for the LawSynth pipeline (no library surface)."
publish = false

[lib]
path = "src/lib.rs"

# Pipeline crates are dev-dependencies: this crate has no runtime API, it only
# hosts integration tests that exercise many crates together. Every dependency
# is an internal path dep — offline, std-only, no external crates.
[dev-dependencies]
lawsynth-core = { path = "../lawsynth-core", version = "0.1.0" }
lawsynth-expr = { path = "../lawsynth-expr", version = "0.1.0" }
lawsynth-data = { path = "../lawsynth-data", version = "0.1.0" }
lawsynth-world = { path = "../lawsynth-world", version = "0.1.0" }
lawsynth-discovery = { path = "../lawsynth-discovery", version = "0.1.0" }
lawsynth-stability = { path = "../lawsynth-stability", version = "0.1.0" }
lawsynth-lyapunov = { path = "../lawsynth-lyapunov", version = "0.1.0" }
lawsynth-jacobian = { path = "../lawsynth-jacobian", version = "0.1.0" }
lawsynth-invariants = { path = "../lawsynth-invariants", version = "0.1.0" }
lawsynth-egraph = { path = "../lawsynth-egraph", version = "0.1.0" }
lawsynth-sim = { path = "../lawsynth-sim", version = "0.1.0" }
lawsynth-basins = { path = "../lawsynth-basins", version = "0.1.0" }
lawsynth-koopman = { path = "../lawsynth-koopman", version = "0.1.0" }
