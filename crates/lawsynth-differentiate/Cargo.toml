[package]
name = "lawsynth-differentiate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Numerical derivative estimation for LawSynth discovery."
autoexamples = false

[[example]]
name = "weak_form_basic"
path = "examples/weak_form_basic.rs"

[[bench]]
name = "spectral_latency"
path = "benches/spectral_latency.rs"
harness = false

[[bench]]
name = "tvreg_throughput"
path = "benches/tvreg_throughput.rs"
harness = false

[dependencies]
lawsynth-data = { path = "../lawsynth-data", version = "0.1.0" }

[dev-dependencies]
lawsynth-core = { path = "../lawsynth-core", version = "0.1.0" }
