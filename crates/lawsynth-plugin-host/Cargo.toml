[package]
name = "lawsynth-plugin-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Safe host-side registry, process, permission, and RPC controls for LawSynth plugins."
autoexamples = false

[dependencies]
lawsynth-plugin-api = { path = "../lawsynth-plugin-api", version = "0.1.0" }
lawsynth-bundle = { path = "../lawsynth-bundle", version = "0.1.0" }

[lib]
path = "src/lib.rs"

[[example]]
name = "resources_basic"
path = "examples/resources_basic.rs"

[[bench]]
name = "permissions_latency"
path = "benches/permissions_latency.rs"
harness = false

[[bench]]
name = "rpc_throughput"
path = "benches/rpc_throughput.rs"
harness = false
