[package]
name = "lawsynth-expr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Deterministic scalar expression IR and evaluator for LawSynth."
autoexamples = false

[[example]]
name = "printer_basic"
path = "examples/printer_basic.rs"

[[bench]]
name = "parser_latency"
path = "benches/parser_latency.rs"
harness = false

[[bench]]
name = "symbol_throughput"
path = "benches/symbol_throughput.rs"
harness = false

[dependencies]
lawsynth-core = { path = "../lawsynth-core", version = "0.1.0" }

[lib]
path = "src/lib.rs"
