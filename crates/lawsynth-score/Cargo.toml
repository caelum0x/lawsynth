[package]
name = "lawsynth-score"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Candidate fit, complexity, and Pareto scoring for LawSynth."
autoexamples = false

[[example]]
name = "pareto_basic"
path = "examples/pareto_basic.rs"

[[bench]]
name = "dimensionality_throughput"
path = "benches/dimensionality_throughput.rs"
harness = false

[[bench]]
name = "residual_latency"
path = "benches/residual_latency.rs"
harness = false

[dependencies]
lawsynth-expr = { path = "../lawsynth-expr" }

[dev-dependencies]
lawsynth-core = { path = "../lawsynth-core" }
