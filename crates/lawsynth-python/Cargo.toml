[package]
name = "lawsynth-python"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "PyO3 bindings for the LawSynth executable World core."
autoexamples = false

[[example]]
name = "py_bundle_basic"
path = "examples/py_bundle_basic.rs"

[[bench]]
name = "py_simulation_latency"
path = "benches/py_simulation_latency.rs"
harness = false

[[bench]]
name = "py_world_throughput"
path = "benches/py_world_throughput.rs"
harness = false

[lib]
name = "_native"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
lawsynth-core = { path = "../lawsynth-core", version = "0.1.0" }
lawsynth-bundle = { path = "../lawsynth-bundle", version = "0.1.0" }
lawsynth-data = { path = "../lawsynth-data", version = "0.1.0" }
lawsynth-discovery = { path = "../lawsynth-discovery", version = "0.1.0" }
lawsynth-differentiate = { path = "../lawsynth-differentiate", version = "0.1.0" }
lawsynth-expr = { path = "../lawsynth-expr", version = "0.1.0" }
lawsynth-sim = { path = "../lawsynth-sim", version = "0.1.0" }
lawsynth-symbolic = { path = "../lawsynth-symbolic", version = "0.1.0" }
lawsynth-world = { path = "../lawsynth-world", version = "0.1.0" }
pyo3 = { version = "0.28.3", features = ["extension-module"] }

[build-dependencies]
# PyO3 deliberately leaves CPython symbols unresolved for extension modules.
# On macOS the dynamic loader must be told to resolve them from the running
# interpreter (`-undefined dynamic_lookup`), which maturin normally supplies.
# Keeping this in Cargo makes a direct `cargo build` equally valid.
pyo3-build-config = "0.28.3"
