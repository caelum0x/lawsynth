[package]
name = "lawsynth-implicit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Implicit / rational (nullspace) dynamics discovery for LawSynth (SINDy-PI style)."
autoexamples = false

[[example]]
name = "recover_rational"
path = "examples/recover_rational.rs"

[dependencies]
lawsynth-core = { path = "../lawsynth-core", version = "0.1.0" }
lawsynth-data = { path = "../lawsynth-data", version = "0.1.0" }
lawsynth-differentiate = { path = "../lawsynth-differentiate", version = "0.1.0" }
lawsynth-sparse = { path = "../lawsynth-sparse", version = "0.1.0" }

[lib]
path = "src/lib.rs"
