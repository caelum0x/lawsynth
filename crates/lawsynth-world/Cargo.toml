[package]
name = "lawsynth-world"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Typed continuous World IR for LawSynth."
autoexamples = false

[[example]]
name = "event_basic"
path = "examples/event_basic.rs"

[[bench]]
name = "graph_throughput"
path = "benches/graph_throughput.rs"
harness = false

[[bench]]
name = "regime_latency"
path = "benches/regime_latency.rs"
harness = false

[dependencies]
lawsynth-core = { path = "../lawsynth-core", version = "0.1.0" }
lawsynth-expr = { path = "../lawsynth-expr", version = "0.1.0" }
lawsynth-units = { path = "../lawsynth-units", version = "0.1.0" }

[lib]
path = "src/lib.rs"
