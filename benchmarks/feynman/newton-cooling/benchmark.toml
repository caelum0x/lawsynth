id = "feynman/newton-cooling"
title = "Newton's law of cooling (framed as dynamics)"
family = "feynman"
version = 1

# Newton cooling, dT/dt = -k (T - T_env), is an affine first-order ODE.  Its RHS
# expands to -k*T + k*T_env, i.e. a linear term plus a constant, both inside the
# degree-1+ polynomial library.  A genuine dynamics-discovery target.
[capability]
status = "supported"
reason = "dT/dt = -k(T - T_env) is an affine first-order ODE inside the polynomial library; recoverable and simulable via the public CLI."

[system]
kind = "newton_cooling"
states = ["T"]
step = 0.05
samples = 300
[system.parameters]
k = 0.7
T_env = 20.0
[system.initial]
T = 90.0

[discovery]
degree = 2
threshold = 0.05

[simulation]
start = 0.0
end = 4.0
step = 0.05

[expect]
simulate = true
symbolic_recovery = "none"
r2_min = 0.99
