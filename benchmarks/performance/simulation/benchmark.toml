id = "performance/simulation"
title = "Discover then simulate"
version = 1

[capability]
status = "supported"

[workload]
workflow = "native-cli"

[generation]
kind = "exponential_decay"
samples = 301
step = 0.01

[generation.parameters]
rate = 0.7

[discovery]
states = ["x"]
degree = 2
threshold = 0.02
trigonometric = false

[simulation]
start = 0.0
end = 1.0
step = 0.01

[simulation.initial]
x = 1.0
