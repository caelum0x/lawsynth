id = "dynamics/ode-chaotic"
title = "Chaotic Lorenz ODE"
version = 1

[capability]
status = "supported"
reason = "The public CLI supports multivariate continuous derivative discovery and simulation; this is an execution/reproducibility benchmark, not an assertion of exact long-horizon chaotic recovery."

[generation]
kind = "lorenz"
samples = 121
step = 0.01

[generation.parameters]
sigma = 10
rho = 28
beta = 2.6666666666666665
x0 = 1
y0 = 1
z0 = 1

[discovery]
states = ["x", "y", "z"]
degree = 2
threshold = 0.05
trigonometric = true

[simulation]
start = 0
end = 0.05
step = 0.01

[simulation.initial]
x = 1
y = 1
z = 1
