id = "strogatz/damped-oscillator"
title = "Damped linear oscillator"
family = "strogatz"
version = 1

[capability]
status = "supported"
reason = "Continuous multivariate derivative discovery + simulation are public CLI capabilities; the linear oscillator is exactly recoverable."

[system]
kind = "damped_oscillator"
states = ["x", "v"]
step = 0.02
samples = 400
[system.parameters]
k = 1.0
c = 0.3
[system.initial]
x = 1.0
v = 0.0

[discovery]
degree = 2
threshold = 0.05

[simulation]
start = 0.0
end = 2.0
step = 0.02

[expect]
simulate = true
symbolic_recovery = "none"
r2_min = 0.99
