[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lawsynth-connectors"
version = "0.1.0"
description = "Bounded, reproducible data connectors for LawSynth"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "LawSynth contributors" }]
dependencies = []

[project.optional-dependencies]
arrow = ["pyarrow>=15"]
dataframes = ["pandas>=2", "polars>=0.20", "xarray>=2024.1"]
duckdb = ["duckdb>=1"]
postgres = ["psycopg[binary]>=3.1"]
s3 = ["boto3>=1.34"]
kafka = ["confluent-kafka>=2.3"]
delta = ["deltalake>=0.17"]
iceberg = ["pyiceberg>=0.6"]
all = [
  "pyarrow>=15",
  "pandas>=2",
  "polars>=0.20",
  "xarray>=2024.1",
  "duckdb>=1",
  "psycopg[binary]>=3.1",
  "boto3>=1.34",
  "confluent-kafka>=2.3",
  "deltalake>=0.17",
  "pyiceberg>=0.6",
]

[project.entry-points."lawsynth.connectors"]
filesystem = "lawsynth_connectors.filesystem:FilesystemConnector"
http = "lawsynth_connectors.http:HttpConnector"
duckdb = "lawsynth_connectors.duckdb:DuckDBConnector"
postgres = "lawsynth_connectors.postgres:PostgresConnector"
s3 = "lawsynth_connectors.s3:S3Connector"
delta = "lawsynth_connectors.delta:DeltaConnector"
iceberg = "lawsynth_connectors.iceberg:IcebergConnector"
kafka = "lawsynth_connectors.kafka:KafkaConnector"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lawsynth_connectors = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
