[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lawsynth-notebook"
version = "0.1.0"
description = "Dependency-free notebook views for inspectable LawSynth artifacts"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "LawSynth contributors"}]
classifiers = ["Programming Language :: Python :: 3", "Typing :: Typed"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
